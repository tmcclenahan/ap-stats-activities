<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's Wrong With This Study? — AP Statistics Study Design Analyzer</title>
<style>
:root{--navy:#0C2340;--gold:#FFD600;--white:#fff;--fix:#fffbea;--red:#c0392b;--redbg:#fff0f0;--green:#27ae60;--greenbg:#f0fff4;}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--navy);color:var(--white);font-family:Arial,Helvetica,sans-serif;line-height:1.5}.site-header{position:sticky;top:0;z-index:10;background:var(--navy);border-bottom:2px solid var(--gold);padding:18px 24px}.header-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand h1{margin:0;font-size:clamp(1.35rem,3vw,2rem);letter-spacing:.2px}.brand p{margin:2px 0 0;color:var(--gold);font-weight:bold}.header-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.button{appearance:none;border:2px solid var(--gold);border-radius:12px;background:var(--navy);color:var(--gold);padding:10px 15px;font-weight:bold;cursor:pointer;transition:.2s}.button:hover,.button:focus-visible{background:var(--gold);color:var(--navy);outline:none}.button.primary{background:var(--gold);color:var(--navy)}.button.primary:hover,.button.primary:focus-visible{background:#ffe45c}.button *{pointer-events:none}.app-shell{max-width:1200px;margin:0 auto;padding:26px 20px 42px}.progress-area{margin-bottom:20px}.progress-row{display:flex;justify-content:space-between;align-items:center;font-weight:bold}.scenario-count{color:var(--gold)}.progress-track{height:9px;background:#29405b;border-radius:99px;overflow:hidden;margin-top:8px}.progress-fill{height:100%;background:var(--gold);width:12.5%;transition:width .25s}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}.panel{min-width:0}.scenario-kicker{color:var(--gold);font-weight:bold;text-transform:uppercase;letter-spacing:.08em;font-size:.9rem}.scenario-title{margin:4px 0 16px;font-size:clamp(1.5rem,3vw,2.2rem)}.study-card,.issue-card,.fix-card{border-radius:12px}.study-card{background:var(--white);color:var(--navy);padding:20px;box-shadow:0 8px 20px #0003}.study-card h3{margin:0 0 10px}.fix-section{margin-top:20px}.fix-section h3{margin:0 0 10px;color:var(--gold)}.fix-card{background:var(--fix);color:var(--navy);padding:18px;margin-top:12px;border:2px solid var(--gold)}.fix-card[hidden]{display:none}.issue-heading{margin:0 0 12px;font-size:1.35rem}.issue-list{display:grid;gap:12px}.issue-card{width:100%;text-align:left;background:var(--white);color:var(--navy);border:2px solid var(--navy);padding:0;cursor:pointer;overflow:hidden;box-shadow:0 5px 12px #0002;transition:.2s}.issue-card:hover,.issue-card:focus-visible{border-color:var(--gold);transform:translateY(-1px);outline:none}.issue-card.revealed.flaw{background:var(--redbg);border:0;border-left:4px solid var(--red);cursor:default}.issue-card.revealed.not-flaw{background:var(--greenbg);border:0;border-left:4px solid var(--green);cursor:default}.issue-name{display:block;font-size:1.05rem;font-weight:bold;padding:16px 17px}.reveal-hint{display:block;padding:0 17px 15px;color:#927c00;font-size:.85rem;font-style:italic}.verdict,.explanation{display:block;padding:0 17px}.verdict{font-weight:bold;padding-top:16px}.flaw .verdict{color:var(--red)}.not-flaw .verdict{color:var(--green)}.explanation{padding-top:8px;padding-bottom:17px}.card-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}.small-note{font-size:.86rem;color:#d7e2ef}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:800px){.site-header{position:static}.header-inner{align-items:flex-start;flex-direction:column}.header-actions{justify-content:flex-start}.workspace{grid-template-columns:1fr}.card-actions{flex-wrap:wrap}.app-shell{padding:20px 14px 32px}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><div class="brand"><h1>What's Wrong With This Study?</h1><p>AP Statistics Study Design Analyzer</p></div><div class="header-actions"><button class="button" data-action="shuffle" type="button">Shuffle</button><button class="button" data-action="reset" type="button">Reset</button></div></div></header>
<main id="app" class="app-shell">
<section class="progress-area" aria-label="Scenario progress"><div class="progress-row"><span class="scenario-count" id="scenarioCount">Scenario 1 of 8</span><span id="revealedCount">0 of 5 revealed</span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></section>
<div class="workspace"><section class="panel scenario-panel"><div class="scenario-kicker" id="scenarioKicker">Scenario 1</div><h2 class="scenario-title" id="scenarioTitle"></h2><article class="study-card"><h3>Study description</h3><p id="scenarioDescription"></p></article><section class="fix-section"><h3>Suggest a Fix</h3><button class="button primary" data-action="toggle-fix" type="button" aria-expanded="false">Reveal Fix</button><div id="fixCard" class="fix-card" hidden></div></section><div class="card-actions"><button class="button" data-action="previous" type="button">← Previous</button><span class="small-note">Use ← and → keys to navigate</span><button class="button" data-action="next" type="button">Next →</button></div></section><section class="panel issues-panel"><h2 class="issue-heading">Is this a problem in <em>THIS</em> study?</h2><div id="issueList" class="issue-list"></div></section></div>
</main>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const scenarios = [
    {title:'The Volunteer Diet Study',description:'A researcher wants to study whether a low-carb diet leads to greater weight loss than a standard diet. She posts a flyer at a gym asking for volunteers. 47 people sign up. All 47 are assigned to the low-carb diet for 8 weeks. At the end, the average weight loss is 6.2 pounds. The researcher concludes that low-carb diets are effective for weight loss.',fix:'Recruit a random sample of participants (not gym volunteers). Randomly assign half to the low-carb diet and half to a standard diet. Measure weight loss for both groups over 8 weeks and compare results.',issues:[['Voluntary Response Bias',true,'Yes — people who volunteer at a gym are likely already motivated to lose weight. This group is not representative of the general population, so results cannot be generalized.'],['No Control Group',true,'Yes — there is no comparison group on a standard diet. Without a control group, we cannot determine whether the low-carb diet caused the weight loss or whether any diet (or just the attention of being in a study) would produce similar results.'],['No Randomization',true,'Yes — all subjects received the same treatment. There was no random assignment to treatment groups, so we cannot establish causation.'],['Sample Size Too Small',false,'47 subjects is a reasonable sample size. The bigger problems here are the lack of a control group and voluntary response bias.'],['Lack of Blinding',false,'Blinding is less critical here since the response variable (weight) is objectively measured. The more serious flaws are the missing control group and biased sample.']]},
    {title:'The Unblinded Drug Trial',description:'A pharmaceutical company tests a new pain reliever. 60 patients with chronic back pain are randomly assigned — 30 receive the new drug and 30 receive a placebo. However, the doctors administering the treatment know which patients are receiving the drug. At the end of the study, doctors rate each patient\'s improvement on a 1–10 scale. The new drug group averages 7.4 and the placebo group averages 5.1.',fix:'Make the study double-blind. Neither the patients nor the doctors rating improvement should know which treatment each patient received. Use a third party to assign and track treatments.',issues:[['Lack of Blinding (Evaluator)',true,'Yes — the doctors know which patients received the drug. This can unconsciously influence how they rate improvement, biasing the results in favor of the drug.'],['No Control Group',false,'There is a control group — the placebo group. This is actually a strength of the design.'],['No Randomization',false,'Patients were randomly assigned to treatment groups. Randomization is present and is a strength here.'],['Placebo Effect Not Controlled',false,'The placebo group does control for the placebo effect among patients. The real problem is that the evaluators are not blinded.'],['Small Sample Size',false,'30 per group is a reasonable starting point. The critical flaw is that evaluators know which treatment each patient received.']]},
    {title:'No Control Group',description:'Researchers test a new memory-enhancing supplement. 40 college students take the supplement daily for 6 weeks. Before and after, students complete a standardized memory test. The average score increases from 72 to 81. Researchers conclude the supplement significantly improves memory.',fix:'Randomly assign students to two groups: one takes the supplement, one takes a placebo. Use a double-blind design so neither students nor evaluators know who received the supplement. Compare memory test scores between groups.',issues:[['No Control Group',true,'Yes — there is no group that did NOT take the supplement. The improvement could be due to practice effects (students got better at the test from taking it twice), natural improvement over time, or other factors unrelated to the supplement.'],['No Randomization',false,'Since there is only one group, randomization to treatments isn\'t possible. The core problem is the missing control group.'],['Confounding Variable (Practice Effect)',true,'Yes — students took the same memory test twice. Improvement may simply reflect familiarity with the test, not the supplement\'s effect. This is a confounding variable.'],['Sample Size Too Small',false,'40 students is a reasonable size. The design flaw — no control group — is the primary problem.'],['Lack of Blinding',true,'Yes — students know they are taking the supplement, which could create a placebo effect and inflate their performance on the second test.']]},
    {title:'Five Per Group',description:'A researcher wants to compare three teaching methods for algebra. She randomly assigns 15 students to three groups of 5. Each group is taught using a different method for one semester. At the end, students take the same algebra test. The researcher concludes that Method B is superior because its group averaged 84, compared to 79 and 76 for the other groups.',fix:'Increase the sample size substantially — aim for at least 20–30 students per group. This reduces variability and makes it more likely that random assignment will balance prior ability across groups.',issues:[['Sample Size Too Small',true,'Yes — with only 5 students per group, results are highly variable. A single outlier can dramatically shift the group average. The difference between 84 and 79 could easily be due to chance with groups this small.'],['No Randomization',false,'Students were randomly assigned to groups. Randomization is present.'],['No Control Group',false,'All three teaching methods are being compared to each other. A separate “no instruction” control group is not necessary here.'],['Confounding Variable',true,'Yes — with only 5 students per group, random assignment may not have balanced prior math ability across groups. One group could have gotten stronger students by chance.'],['Lack of Blinding',false,'Students knowing which method they are receiving is unlikely to significantly bias an algebra test score. The main flaw is the tiny sample size.']]},
    {title:'Student Choice of Study Environment',description:'A researcher wants to know whether studying with background music improves test performance. Students are allowed to choose whether they study with music or in silence. After two weeks, both groups take the same exam. The music group averages 83 and the silence group averages 76. The researcher concludes that music helps students study.',fix:'Randomly assign students to study with music or in silence. This removes self-selection bias and allows a causal conclusion if a difference is found.',issues:[['Confounding Variable',true,'Yes — students who chose music may differ systematically from those who chose silence. For example, students who prefer music may be more relaxed test-takers or have different study habits. These differences, not the music itself, could explain the score gap.'],['No Randomization',true,'Yes — students self-selected their condition. Without random assignment, we cannot establish that music caused the higher scores.'],['No Control Group',false,'The silence group serves as the control condition. This is not the primary flaw.'],['Voluntary Response Bias',false,'All students in the class participated — this is not a voluntary response situation. The problem is self-selection into conditions, which is a lack of randomization.'],['Lack of Blinding',false,'Students knowing whether they are listening to music is unavoidable in this context. The critical flaw is the lack of random assignment.']]},
    {title:'One School, All Teens',description:'A researcher wants to estimate the proportion of U.S. high school students who experience significant stress. She selects one high school in her city and surveys all 300 students. 68% report significant stress. She concludes that approximately 68% of U.S. high school students experience significant stress.',fix:'Use a stratified random sample. Divide U.S. high schools into strata by region and school type, then randomly select schools and randomly sample students within each selected school.',issues:[['Lack of Generalizability',true,'Yes — one school in one city is not representative of all U.S. high school students. Schools vary widely by region, socioeconomic status, academic pressure, and culture. Results cannot be generalized to the national population.'],['Cluster Sampling Bias',true,'Yes — surveying an entire single cluster (one school) introduces bias if that cluster is not representative of the population. A better approach would be to randomly select many schools and sample within them.'],['No Control Group',false,'This is a survey, not an experiment. A control group is not applicable here.'],['Sample Size Too Small',false,'300 students is a reasonable sample size. The problem is not the number of students but the fact that they all come from one non-representative school.'],['Voluntary Response Bias',false,'All students at the school were surveyed, not just volunteers. The flaw is the non-representative sampling method, not voluntary response.']]},
    {title:'The Unrandomized Matched Pairs',description:'A researcher tests two studying techniques — flashcards vs. re-reading — on the same group of 20 students. Each student uses flashcards for Unit 1 and re-reading for Unit 2, then takes a quiz after each unit. Flashcard quizzes average 88 and re-reading quizzes average 81. The researcher concludes flashcards are more effective.',fix:'Randomly assign half the students to use flashcards for Unit 1 and re-reading for Unit 2, and the other half to the reverse order. This controls for order effects and unit difficulty differences.',issues:[['Order Not Randomized',true,'Yes — every student used flashcards first and re-reading second. Students may have performed better on Unit 1 quizzes simply because Unit 1 material was easier, or worse on Unit 2 because of fatigue. The order of treatments was not randomized.'],['Confounding Variable (Unit Difficulty)',true,'Yes — Unit 1 and Unit 2 may differ in difficulty. If Unit 1 is easier, flashcard scores would be inflated regardless of the technique\'s effectiveness.'],['No Control Group',false,'In a matched pairs design, each subject serves as their own control. A separate control group is not required.'],['Sample Size Too Small',false,'20 students is a reasonable size for a matched pairs design. The critical flaw is the unrandomized order.'],['Lack of Blinding',false,'Students knowing which technique they are using is inherent to this type of study. The main flaw is the failure to randomize treatment order.']]},
    {title:'The Sleep Study Without Blocking',description:'A researcher studies the effect of sleep duration on reaction time. 60 participants are randomly assigned to one of three groups: 5 hours, 7 hours, or 9 hours of sleep per night for two weeks. Reaction time is measured at the end. The researcher finds no statistically significant difference between groups and concludes sleep duration does not affect reaction time.',fix:'Block participants by age group (e.g., 18–30, 31–50, 51+) and measure baseline reaction time before the study begins. Randomly assign within each block to the three sleep conditions. This reduces variability and increases the power to detect a real effect.',issues:[['Ignored Blocking Variable (Age)',true,'Yes — age is strongly associated with both sleep patterns and reaction time. If the three groups ended up with different age distributions by chance, age could be masking the true effect of sleep duration. Blocking by age would reduce this variability.'],['Ignored Blocking Variable (Baseline Reaction Time)',true,'Yes — participants likely differ in their natural reaction time before the study begins. Without blocking or measuring baseline reaction time, this variability is absorbed into the error, making it harder to detect a real treatment effect.'],['No Randomization',false,'Participants were randomly assigned to sleep groups. Randomization is present and is a strength.'],['No Control Group',false,'The three sleep groups serve as comparison conditions for each other. A “no sleep” control is not practical or ethical.'],['Lack of Blinding',false,'Participants cannot be blinded to how many hours they sleep. The more actionable flaw is the failure to block on key variables like age or baseline reaction time.']]}
  ];
  const app = document.getElementById('app');
  const title = document.getElementById('scenarioTitle');
  const kicker = document.getElementById('scenarioKicker');
  const description = document.getElementById('scenarioDescription');
  const issueList = document.getElementById('issueList');
  const fixCard = document.getElementById('fixCard');
  const count = document.getElementById('scenarioCount');
  const revealedCount = document.getElementById('revealedCount');
  const progressFill = document.getElementById('progressFill');
  const fixButton = document.querySelector('[data-action="toggle-fix"]');
  let order = scenarios.map((_, index) => index);
  let current = 0;
  let revealed = new Set();
  function render() {
    const scenario = scenarios[order[current]];
    kicker.textContent = 'Scenario ' + (current + 1);
    title.textContent = scenario.title;
    description.textContent = scenario.description;
    count.textContent = 'Scenario ' + (current + 1) + ' of ' + scenarios.length;
    progressFill.style.width = (((current + 1) / scenarios.length) * 100) + '%';
    issueList.innerHTML = '';
    revealed = new Set();
    scenario.issues.forEach(function (issue, index) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'issue-card';
      card.dataset.action = 'reveal-issue';
      card.dataset.issueIndex = index;
      card.setAttribute('aria-expanded', 'false');
      card.innerHTML = '<span class="issue-name">' + escapeHTML(issue[0]) + '</span><span class="reveal-hint">Tap to Reveal</span><span class="verdict" hidden></span><span class="explanation" hidden></span>';
      issueList.appendChild(card);
    });
    fixCard.textContent = scenario.fix;
    fixCard.hidden = true;
    fixButton.textContent = 'Reveal Fix';
    fixButton.setAttribute('aria-expanded', 'false');
    updateRevealedCount();
  }
  function escapeHTML(value) { const div = document.createElement('div'); div.textContent = value; return div.innerHTML; }
  function updateRevealedCount() { revealedCount.textContent = revealed.size + ' of 5 revealed'; }
  function move(direction) { current = (current + direction + scenarios.length) % scenarios.length; render(); window.scrollTo({top:0, behavior:'smooth'}); }
  function shuffleOrder() { for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } current = 0; render(); }
  function resetOrder() { order = scenarios.map((_, index) => index); current = 0; render(); }
  app.addEventListener('click', function (event) {
    const actionTarget = event.target.closest('[data-action]');
    if (!actionTarget || !app.contains(actionTarget)) return;
    const action = actionTarget.dataset.action;
    if (action === 'reveal-issue') {
      const issueIndex = Number(actionTarget.dataset.issueIndex);
      if (revealed.has(issueIndex)) return;
      const issue = scenarios[order[current]].issues[issueIndex];
      const verdict = actionTarget.querySelector('.verdict');
      const explanation = actionTarget.querySelector('.explanation');
      actionTarget.classList.add('revealed', issue[1] ? 'flaw' : 'not-flaw');
      verdict.textContent = issue[1] ? '⚠ YES — This is a flaw' : '✓ Not the main issue here';
      explanation.textContent = issue[2];
      actionTarget.querySelector('.reveal-hint').hidden = true;
      verdict.hidden = false;
      explanation.hidden = false;
      actionTarget.setAttribute('aria-expanded', 'true');
      revealed.add(issueIndex);
      updateRevealedCount();
    } else if (action === 'toggle-fix') {
      const isHidden = fixCard.hidden;
      fixCard.hidden = !isHidden;
      fixButton.textContent = isHidden ? 'Hide Fix' : 'Reveal Fix';
      fixButton.setAttribute('aria-expanded', String(isHidden));
    } else if (action === 'previous') move(-1);
    else if (action === 'next') move(1);
    else if (action === 'shuffle') shuffleOrder();
    else if (action === 'reset') resetOrder();
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowLeft') { event.preventDefault(); move(-1); }
    if (event.key === 'ArrowRight') { event.preventDefault(); move(1); }
  });
  document.addEventListener('wheel', function (event) { if (event.target.matches('input[type="number"]')) event.preventDefault(); }, {passive:false});
  render();
});
</script>
</body>
</html>
