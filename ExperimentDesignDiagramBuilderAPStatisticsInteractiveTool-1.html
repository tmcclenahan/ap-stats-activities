<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiment Design Diagram Builder</title>
<style>
:root{--navy:#0C2340;--gold:#FFD600;--gold-tint:#fffbea;--gray:#ccd4dc;--muted:#667587;--shadow:0 4px 12px rgba(0,0,0,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--navy);background:#f4f7fa;font-family:Arial,Helvetica,sans-serif}
.site-header{position:sticky;top:0;z-index:10;padding:18px 28px;color:#fff;background:var(--navy);box-shadow:0 2px 10px rgba(0,0,0,.16)}
.site-header h1{margin:0;font-size:clamp(1.35rem,2.8vw,2rem)}.site-header p{margin:5px 0 0;color:#eaf1f8;font-weight:600}
#app{min-height:100vh}.workspace{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:22px;max-width:1500px;margin:0 auto;padding:24px}.panel{background:#fff;border-radius:12px;box-shadow:var(--shadow)}.controls{padding:22px;align-self:start}.diagram-panel{padding:16px;min-width:0}.section+.section{margin-top:26px}.section-title{margin:0 0 12px;font-size:1.02rem;letter-spacing:.02em}.design-options{display:grid;gap:10px}.design-card{position:relative;display:block;padding:13px 14px 13px 42px;border:2px solid var(--gray);border-radius:12px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s}.design-card.selected{border-color:var(--navy);background:var(--gold-tint)}.design-card input{position:absolute;opacity:0;width:1px;height:1px}.radio-dot{position:absolute;left:14px;top:16px;width:18px;height:18px;border:2px solid var(--navy);border-radius:50%}.design-card.selected .radio-dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--gold)}.design-name{display:block;font-weight:700;line-height:1.25}.design-help{display:block;margin-top:5px;color:var(--muted);font-size:.84rem;line-height:1.3}.field{margin-bottom:13px}label{display:block;margin-bottom:6px;font-weight:700;font-size:.9rem}input[type=text]{width:100%;padding:10px 11px;border:1px solid #b9c4cf;border-radius:8px;color:var(--navy);background:#fff;font:inherit}input[type=text]:focus{outline:3px solid rgba(255,214,0,.35);border-color:var(--navy)}.dynamic-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}.dynamic-heading label{margin:0}.dynamic-list{display:grid;gap:8px}.dynamic-row{display:flex;gap:7px;align-items:center}.dynamic-row input{min-width:0}.row-label{width:58px;flex:0 0 58px;color:var(--muted);font-size:.8rem;font-weight:700}button{border:0;border-radius:8px;padding:10px 13px;font:inherit;font-weight:700;cursor:pointer}button>*{pointer-events:none}.small-button{padding:7px 9px;font-size:.82rem;white-space:nowrap}.add-button{color:var(--navy);background:var(--gold)}.remove-button{flex:0 0 31px;padding:7px 0;color:#fff;background:#7e8b99}.primary-button{width:100%;color:#fff;background:var(--navy)}.muted-note{margin:10px 0 0;color:var(--muted);font-size:.8rem;line-height:1.35}.hidden{display:none!important}.diagram-frame{width:100%;overflow:auto;border:1px solid #e0e6ec;border-radius:10px;background:#fbfcfd}#diagram{display:block;width:100%;min-width:700px;height:auto}.print-footer{display:none}
@media(max-width:800px){.workspace{grid-template-columns:1fr;padding:14px}.diagram-panel{order:2}.controls{order:1}#diagram{min-width:620px}}@media print{body{background:#fff}.site-header,.controls{display:none!important}.workspace{display:block;padding:0;max-width:none}.diagram-panel{padding:0;box-shadow:none;border-radius:0}.diagram-frame{border:0;overflow:visible}#diagram{width:100%;min-width:0}.print-footer{display:block;margin-top:8px;color:#68727d;font-size:10pt;text-align:center}}
</style>
</head>
<body>
<div id="app">
<header class="site-header"><h1>Experiment Design Diagram Builder</h1><p>AP Statistics</p></header>
<main class="workspace">
<aside class="panel controls" aria-label="Experiment design controls">
<section class="section"><h2 class="section-title">1. Design Type</h2><div class="design-options">
<label class="design-card selected" data-design-card="crd"><input type="radio" name="design" value="crd" checked><span class="radio-dot" aria-hidden="true"></span><span class="design-name">Completely Randomized Design (CRD)</span><span class="design-help">All units randomly assigned to treatment groups with no prior grouping.</span></label>
<label class="design-card" data-design-card="block"><input type="radio" name="design" value="block"><span class="radio-dot" aria-hidden="true"></span><span class="design-name">Randomized Block Design</span><span class="design-help">Units grouped by a characteristic first, then randomly assigned within each group.</span></label>
<label class="design-card" data-design-card="pairs"><input type="radio" name="design" value="pairs"><span class="radio-dot" aria-hidden="true"></span><span class="design-name">Matched Pairs Design</span><span class="design-help">Each unit receives both treatments, or units are paired by similarity.</span></label>
</div></section>
<section class="section"><h2 class="section-title">2. Your Labels</h2>
<div class="field"><label for="units">Experimental Units</label><input id="units" type="text" placeholder="e.g. College-aged volunteers"></div>
<div class="field"><label for="response">Response Variable</label><input id="response" type="text" placeholder="e.g. Score on memory recall test"></div>
<div id="group-section" class="field"><div class="dynamic-heading"><label>Treatment Groups</label><button class="small-button add-button" type="button" data-action="add-treatment">＋ Add Treatment Group</button></div><div id="treatment-list" class="dynamic-list"></div></div>
<div id="block-section" class="hidden"><div class="field"><label for="blocking">Blocking Variable</label><input id="blocking" type="text" placeholder="e.g. Gender (male / female)"></div><div class="field"><div class="dynamic-heading"><label>Block Labels</label><button class="small-button add-button" type="button" data-action="add-block">＋ Add Block</button></div><div id="block-list" class="dynamic-list"></div></div></div>
<div id="pairs-section" class="hidden"><div class="field"><label for="treatment-a">Treatment A</label><input id="treatment-a" type="text" placeholder="e.g. New pain reliever"></div><div class="field"><label for="treatment-b">Treatment B</label><input id="treatment-b" type="text" placeholder="e.g. Placebo"></div></div>
</section>
<section class="section"><h2 class="section-title">3. Actions</h2><button class="primary-button" type="button" data-action="print">🖨 Print / Save as PDF</button><p class="muted-note">Your diagram updates instantly as you type. Use your browser's print dialog to save a PDF.</p></section>
</aside>
<section class="panel diagram-panel" aria-label="Live experiment design diagram"><div class="diagram-frame"><svg id="diagram" role="img" aria-label="Experiment design flowchart" viewBox="0 0 1100 400" xmlns="http://www.w3.org/2000/svg"></svg></div><div class="print-footer">Experiment Design Diagram Builder — AP Statistics</div></section>
</main></div>
<script>
document.addEventListener('DOMContentLoaded',function(){
const app=document.getElementById('app'),diagram=document.getElementById('diagram'),treatmentList=document.getElementById('treatment-list'),blockList=document.getElementById('block-list'),groupSection=document.getElementById('group-section'),blockSection=document.getElementById('block-section'),pairsSection=document.getElementById('pairs-section'),designCards=Array.from(document.querySelectorAll('[data-design-card]'));let currentDesign='crd';
function createTextInput(className,placeholder,value){const input=document.createElement('input');input.type='text';input.className=className||'';input.placeholder=placeholder;input.value=value||'';return input}
function renderTreatmentInputs(values){treatmentList.innerHTML='';values.forEach(function(value,index){const row=document.createElement('div');row.className='dynamic-row';const input=createTextInput('treatment-input',index===0?'e.g. 6 hours of sleep':index===1?'e.g. 8 hours of sleep':'e.g. Treatment '+(index+1),value);input.setAttribute('aria-label','Treatment group '+(index+1));row.appendChild(input);const remove=document.createElement('button');remove.type='button';remove.className='remove-button';remove.dataset.action='remove-treatment';remove.dataset.index=String(index);remove.setAttribute('aria-label','Remove treatment group '+(index+1));remove.textContent='✕';row.appendChild(remove);treatmentList.appendChild(row)});updateAddButtonStates()}
function renderBlockInputs(values){blockList.innerHTML='';values.forEach(function(value,index){const row=document.createElement('div');row.className='dynamic-row';const label=document.createElement('span');label.className='row-label';label.textContent='Block '+(index+1);row.appendChild(label);const input=createTextInput('block-input',index===0?'e.g. Male':index===1?'e.g. Female':'e.g. Group '+(index+1),value);input.setAttribute('aria-label','Block '+(index+1));row.appendChild(input);const remove=document.createElement('button');remove.type='button';remove.className='remove-button';remove.dataset.action='remove-block';remove.dataset.index=String(index);remove.setAttribute('aria-label','Remove block '+(index+1));remove.textContent='✕';row.appendChild(remove);blockList.appendChild(row)});updateAddButtonStates()}
function getValues(selector){return Array.from(document.querySelectorAll(selector)).map(function(input){return input.value})}function updateAddButtonStates(){const at=document.querySelector('[data-action="add-treatment"]'),ab=document.querySelector('[data-action="add-block"]');if(at)at.disabled=getValues('.treatment-input').length>=6;if(ab)ab.disabled=getValues('.block-input').length>=4}
function syncDesignVisibility(){groupSection.classList.toggle('hidden',currentDesign==='pairs');blockSection.classList.toggle('hidden',currentDesign!=='block');pairsSection.classList.toggle('hidden',currentDesign!=='pairs');designCards.forEach(function(card){card.classList.toggle('selected',card.dataset.designCard===currentDesign)})}
function getLabel(value,fallback){return value.trim()||fallback}function escapeXml(value){return String(value).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&apos;','"':'&quot;'}[c]})}function wrapText(text,maxLength){const words=String(text).split(/\s+/).filter(Boolean);if(!words.length)return[''];const lines=[''];words.forEach(function(word){const next=lines[lines.length-1]?lines[lines.length-1]+' '+word:word;if(next.length>maxLength&&lines[lines.length-1])lines.push(word);else lines[lines.length-1]=next});if(lines.length>2)return[lines[0],lines.slice(1).join(' ').slice(0,maxLength-1)+'…'];return lines}
function box(x,y,width,height,text,placeholder){const lines=wrapText(text,28),cls=placeholder?'placeholder':'';let textSvg='<text class="box-text '+cls+'" x="'+x+'" y="'+y+'" dominant-baseline="middle" text-anchor="middle">';if(lines.length===1)textSvg+=escapeXml(lines[0]);else textSvg+='<tspan x="'+x+'" dy="-10">'+escapeXml(lines[0])+'</tspan><tspan x="'+x+'" dy="20">'+escapeXml(lines[1])+'</tspan>';textSvg+='</text>';return '<rect class="flow-box" x="'+(x-width/2)+'" y="'+(y-height/2)+'" width="'+width+'" height="'+height+'" rx="10"></rect>'+textSvg}
function arrow(x1,y1,x2,y2){return '<line class="arrow" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" marker-end="url(#arrowhead)"></line>'}function defs(){return '<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#FFD600"></path></marker></defs>'}function diagramShell(viewBox,content){diagram.setAttribute('viewBox',viewBox);diagram.innerHTML=defs()+'<style>.flow-box{fill:#0C2340;stroke:#FFD600;stroke-width:3}.box-text{fill:#fff;font-family:Arial,Helvetica,sans-serif;font-size:13px}.box-text.placeholder{fill:#9ba6b4;font-style:italic}.arrow{stroke:#FFD600;stroke-width:3;fill:none}</style>'+content}
function distribute(count,min,max,center){if(count===1)return[center];const gap=Math.min(max,Math.max(20,(2*max)/(count-1)));const total=gap*(count-1);let start=center-total/2;if(start-min<0)start=min;return Array.from({length:count},(_,i)=>start+i*gap)}
function renderCrd(){const units=document.getElementById('units').value,response=document.getElementById('response').value,treatments=getValues('.treatment-input');const ys=treatments.length===2?[130,270]:treatments.length===3?[100,200,300]:distribute(treatments.length,80,100,200);let content=box(110,200,200,56,getLabel(units,'Experimental Units'),!units.trim());content+=arrow(210,200,225,200);content+=box(310,200,170,56,'Random Assignment',false);treatments.forEach(function(t,i){content+=arrow(395,200,495,ys[i]);content+=box(580,ys[i],170,60,getLabel(t,'Treatment '+(i+1)),!t.trim());content+=arrow(665,ys[i],765,200)});content+=box(870,200,210,56,'Measure: '+getLabel(response,'Response Variable'),!response.trim());diagramShell('0 0 1100 400',content)}
function renderBlock(){const units=document.getElementById('units').value,response=document.getElementById('response').value,blocking=document.getElementById('blocking').value,treatments=getValues('.treatment-input'),blocks=getValues('.block-input');const by=blocks.length===1?[250]:distribute(blocks.length,100,130,250);let content=box(110,250,180,54,getLabel(units,'Experimental Units'),!units.trim());content+=arrow(200,250,190,250);content+=box(310,250,240,60,'Divide into Blocks by: '+getLabel(blocking,'Blocking Variable'),!blocking.trim());blocks.forEach(function(b,i){const y=by[i];content+=arrow(430,250,490,y);content+=box(560,y,140,54,getLabel(b,'Block '+(i+1)),!b.trim());content+=arrow(630,y,685,y);content+=box(760,y,150,54,'Random Assignment',false);const offsets=treatments.length===1?[0]:treatments.map((_,j)=>(j-(treatments.length-1)/2)*Math.min(40,Math.max(20,80/(treatments.length-1))));treatments.forEach(function(t,j){const ty=Math.max(40,Math.min(460,y+offsets[j]));content+=arrow(835,y,885,ty);content+=box(960,ty,150,56,getLabel(t,'Treatment '+(j+1)),!t.trim());content+=arrow(1035,ty,1060,250)})});content+=box(1170,250,210,54,'Measure: '+getLabel(response,'Response Variable'),!response.trim());diagramShell('0 0 1300 500',content)}
function renderPairs(){const units=document.getElementById('units').value,response=document.getElementById('response').value,a=document.getElementById('treatment-a').value,b=document.getElementById('treatment-b').value;let content=box(110,210,180,56,getLabel(units,'Experimental Units'),!units.trim());content+=arrow(200,210,205,210);content+=box(320,210,230,70,'Randomly Assign Treatment Order Within Each Pair',false);content+=arrow(435,175,490,110);content+=arrow(435,245,490,310);content+=box(580,110,180,56,'Period 1: '+getLabel(a,'Treatment A'),!a.trim());content+=box(580,310,180,56,'Period 1: '+getLabel(b,'Treatment B'),!b.trim());content+=arrow(670,110,730,310);content+=arrow(670,310,730,110);content+=box(820,110,180,56,'Period 2: '+getLabel(b,'Treatment B'),!b.trim());content+=box(820,310,180,56,'Period 2: '+getLabel(a,'Treatment A'),!a.trim());content+=arrow(910,110,930,210);content+=arrow(910,310,930,210);content+=box(1020,210,180,56,'Measure: '+getLabel(response,'Response Variable'),!response.trim());diagramShell('0 0 1100 420',content)}
function renderDiagram(){if(currentDesign==='crd')renderCrd();if(currentDesign==='block')renderBlock();if(currentDesign==='pairs')renderPairs()}
function handleAction(action,target){if(action==='print'){window.print();return}if(action==='add-treatment'){const values=getValues('.treatment-input');if(values.length<6)renderTreatmentInputs(values.concat(''))}if(action==='remove-treatment'){const values=getValues('.treatment-input');if(values.length>2){values.splice(Number(target.dataset.index),1);renderTreatmentInputs(values)}}if(action==='add-block'){const values=getValues('.block-input');if(values.length<4)renderBlockInputs(values.concat(''))}if(action==='remove-block'){const values=getValues('.block-input');if(values.length>2){values.splice(Number(target.dataset.index),1);renderBlockInputs(values)}}renderDiagram()}
app.addEventListener('click',function(event){const target=event.target.closest('[data-action]');if(target&&app.contains(target))handleAction(target.dataset.action,target)});app.addEventListener('change',function(event){if(event.target.matches('input[name="design"]')){currentDesign=event.target.value;syncDesignVisibility();renderDiagram()}});app.addEventListener('input',function(event){if(event.target.matches('input'))renderDiagram()});app.addEventListener('wheel',function(event){if(event.target.matches('input[type="number"]'))event.preventDefault()},{passive:false});renderTreatmentInputs(['','']);renderBlockInputs(['','']);syncDesignVisibility();renderDiagram();
});
</script>
</body>
</html>
