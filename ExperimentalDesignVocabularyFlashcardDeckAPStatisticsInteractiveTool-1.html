<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experimental Design Flashcard Deck</title>
  <style>
    :root {
      --navy: #0C2340;
      --gold: #FFD600;
      --white: #FFFFFF;
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--navy);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      border: 2px solid var(--gold);
      border-radius: 12px;
      background: var(--navy);
      color: var(--gold);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 0.7rem 1rem;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    button:hover, button:focus-visible {
      background: var(--gold);
      color: var(--navy);
      outline: none;
    }

    button:active { transform: scale(0.97); }
    button * { pointer-events: none; }

    .app {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
      text-align: center;
    }

    header { margin-bottom: 1.5rem; }

    h1 {
      color: var(--white);
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      margin: 0;
    }

    .subtitle {
      color: var(--gold);
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0.45rem 0 0;
    }

    .counter {
      color: var(--white);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.55rem;
    }

    .progress-track {
      width: min(560px, 100%);
      height: 7px;
      margin: 0 auto 1.35rem;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
    }

    .progress-bar {
      width: 4%;
      height: 100%;
      background: var(--gold);
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    .card-scene {
      width: min(560px, 100%);
      height: 320px;
      margin: 0 auto 1.4rem;
      perspective: 1200px;
    }

    .flashcard {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }

    .flashcard.is-flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      border: 3px solid var(--gold);
      border-radius: 12px;
      box-shadow: 0 12px 28px var(--shadow);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      background: var(--navy);
      color: var(--white);
    }

    .card-front h2 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2rem);
      line-height: 1.2;
    }

    .card-back {
      background: var(--white);
      color: var(--navy);
      font-size: 1rem;
      line-height: 1.55;
      text-align: left;
      transform: rotateY(180deg);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.7rem;
      margin: 0 auto 1rem;
    }

    .hint {
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.9rem;
      margin: 0;
    }

    @media (max-width: 620px) {
      .app { padding-top: 1.35rem; }
      .card-scene { height: 300px; }
      .card-face { padding: 1.4rem; }
      .controls button { flex: 1 1 40%; }
    }

    @media print {
      @page { margin: 0.5in; }

      body { background: var(--navy); }
      .app { width: 100%; max-width: none; padding: 0; }
      header { margin-bottom: 0.35in; }
      .controls, .hint, .counter, .progress-track, .card-scene { display: none !important; }

      .print-grid {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        gap: 0.18in;
      }

      .print-card {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 1.55in;
        overflow: hidden;
        border: 2px solid var(--gold);
        border-radius: 12px;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .print-term, .print-definition {
        display: flex;
        align-items: center;
        padding: 0.18in;
      }

      .print-term {
        justify-content: center;
        background: var(--navy);
        color: var(--white);
        font-size: 0.92rem;
        font-weight: 700;
        text-align: center;
      }

      .print-definition {
        background: var(--white);
        border-left: 2px dashed var(--navy);
        color: var(--navy);
        font-size: 0.75rem;
        line-height: 1.3;
      }
    }

    .print-grid { display: none; }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header>
      <h1>Experimental Design Flashcard Deck</h1>
      <p class="subtitle">AP Statistics</p>
    </header>

    <div class="counter" id="counter" aria-live="polite">Card 1 of 25</div>
    <div class="progress-track" aria-label="Deck progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <section class="card-scene" aria-label="Current flashcard">
      <div class="flashcard" id="flashcard" data-action="flip" tabindex="0" role="button" aria-label="Flashcard. Click to flip.">
        <div class="card-face card-front">
          <h2 id="termText"></h2>
        </div>
        <div class="card-face card-back">
          <p id="definitionText"></p>
        </div>
      </div>
    </section>

    <div class="controls">
      <button type="button" data-action="previous">Previous</button>
      <button type="button" data-action="next">Next</button>
      <button type="button" data-action="shuffle">Shuffle</button>
      <button type="button" data-action="print">Print All Cards</button>
      <button type="button" data-action="reset">Reset</button>
    </div>

    <p class="hint">Click the card to flip • Use ← → to navigate • Press Space to flip</p>
    <section class="print-grid" id="printGrid" aria-label="Printable flashcards"></section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const originalCards = [
        { term: 'Experiment', definition: 'A study in which researchers deliberately impose treatments on experimental units in order to observe a response.' },
        { term: 'Observational Study', definition: 'A study in which researchers observe individuals and measure variables of interest without imposing any treatment.' },
        { term: 'Experimental Units', definition: 'The individuals (people, animals, plants, objects) to which treatments are applied in an experiment.' },
        { term: 'Subjects', definition: 'Experimental units that are human beings.' },
        { term: 'Treatment', definition: 'A specific condition applied to experimental units; a combination of factor levels.' },
        { term: 'Factor', definition: 'An explanatory variable that is manipulated by the researcher in an experiment.' },
        { term: 'Level', definition: 'A specific value or category of a factor used in an experiment.' },
        { term: 'Response Variable', definition: 'The outcome variable that is measured after a treatment is applied; what the researcher is trying to explain or predict.' },
        { term: 'Explanatory Variable', definition: 'A variable that may cause or explain changes in the response variable; manipulated by the researcher.' },
        { term: 'Control Group', definition: 'A group of experimental units that receives no treatment (or a placebo) so results can be compared to the treatment group(s).' },
        { term: 'Placebo', definition: 'An inactive treatment (such as a sugar pill) that resembles the real treatment but has no active effect.' },
        { term: 'Placebo Effect', definition: 'The tendency of subjects to respond differently simply because they believe they are receiving a treatment, even if it is inactive.' },
        { term: 'Blinding', definition: 'A technique in which subjects and/or researchers are kept unaware of which treatment each subject is receiving.' },
        { term: 'Single-Blind', definition: 'An experiment in which either the subjects or the evaluators (but not both) do not know which treatment is being administered.' },
        { term: 'Double-Blind', definition: 'An experiment in which neither the subjects nor the evaluators know which treatment each subject is receiving.' },
        { term: 'Confounding Variable', definition: 'A variable that is associated with both the explanatory variable and the response variable, making it difficult to determine the true cause of an observed effect.' },
        { term: 'Lurking Variable', definition: 'A variable that is not included in the study but affects the relationship between the explanatory and response variables.' },
        { term: 'Randomization', definition: 'The use of chance to assign experimental units to treatment groups, helping to balance the effects of unknown variables across groups.' },
        { term: 'Replication', definition: 'Using enough experimental units in each treatment group so that results are reliable and the experiment could be repeated with similar outcomes.' },
        { term: 'Completely Randomized Design (CRD)', definition: 'An experimental design in which all experimental units are randomly assigned to treatment groups with no prior grouping or blocking.' },
        { term: 'Randomized Block Design', definition: 'An experimental design in which units are first grouped into blocks based on a shared characteristic, then randomly assigned to treatments within each block.' },
        { term: 'Block', definition: 'A group of experimental units that are similar in some way that is expected to affect the response variable; used to reduce variability.' },
        { term: 'Matched Pairs Design', definition: 'An experimental design in which subjects are paired based on similarity (or the same subject receives both treatments), and treatments are randomly assigned within each pair.' },
        { term: 'Statistically Significant', definition: 'A result is statistically significant if it is unlikely to have occurred by chance alone, suggesting the treatment had a real effect.' },
        { term: 'Scope of Inference', definition: 'The extent to which conclusions from a study can be generalized (to a population) or used to establish causation (based on random assignment).' }
      ];

      const app = document.getElementById('app');
      const flashcard = document.getElementById('flashcard');
      const termText = document.getElementById('termText');
      const definitionText = document.getElementById('definitionText');
      const counter = document.getElementById('counter');
      const progressBar = document.getElementById('progressBar');
      const printGrid = document.getElementById('printGrid');

      let cards = originalCards.slice();
      let currentIndex = 0;
      let isFlipped = false;

      function renderCard() {
        const card = cards[currentIndex];
        termText.textContent = card.term;
        definitionText.textContent = card.definition;
        counter.textContent = 'Card ' + (currentIndex + 1) + ' of ' + cards.length;
        progressBar.style.width = (((currentIndex + 1) / cards.length) * 100) + '%';
        flashcard.classList.toggle('is-flipped', isFlipped);
        flashcard.setAttribute('aria-label', isFlipped ? 'Definition for ' + card.term + '. Click to flip back.' : 'Term: ' + card.term + '. Click to flip.');
      }

      function flipCard() {
        isFlipped = !isFlipped;
        renderCard();
      }

      function moveCard(direction) {
        currentIndex = (currentIndex + direction + cards.length) % cards.length;
        isFlipped = false;
        renderCard();
      }

      function shuffleCards() {
        for (let i = cards.length - 1; i > 0; i -= 1) {
          const randomIndex = Math.floor(Math.random() * (i + 1));
          const temporaryCard = cards[i];
          cards[i] = cards[randomIndex];
          cards[randomIndex] = temporaryCard;
        }
        currentIndex = 0;
        isFlipped = false;
        renderCard();
      }

      function resetDeck() {
        cards = originalCards.slice();
        currentIndex = 0;
        isFlipped = false;
        renderCard();
      }

      function renderPrintCards() {
        printGrid.innerHTML = '';
        originalCards.forEach(function (card, index) {
          const printCard = document.createElement('article');
          printCard.className = 'print-card';
          printCard.innerHTML = '<div class="print-term">' + (index + 1) + '. ' + card.term + '</div>' +
            '<div class="print-definition">' + card.definition + '</div>';
          printGrid.appendChild(printCard);
        });
      }

      app.addEventListener('click', function (event) {
        const actionTarget = event.target.closest('[data-action]');
        if (!actionTarget || !app.contains(actionTarget)) return;

        const action = actionTarget.dataset.action;
        if (action === 'flip') flipCard();
        if (action === 'previous') moveCard(-1);
        if (action === 'next') moveCard(1);
        if (action === 'shuffle') shuffleCards();
        if (action === 'reset') resetDeck();
        if (action === 'print') window.print();
      });

      app.addEventListener('keydown', function (event) {
        if (event.target !== flashcard && event.target.tagName !== 'BODY') return;

        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          moveCard(-1);
        } else if (event.key === 'ArrowRight') {
          event.preventDefault();
          moveCard(1);
        } else if (event.key === ' ') {
          event.preventDefault();
          flipCard();
        }
      });

      document.addEventListener('wheel', function (event) {
        if (event.target.matches('input[type="number"]')) event.preventDefault();
      }, { passive: false });

      renderPrintCards();
      renderCard();
    });
  </script>
</body>
</html>
